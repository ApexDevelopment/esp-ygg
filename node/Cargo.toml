[package]
name = "yggdrasil-espnow"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A sans-IO Yggdrasil node that peers over ESP-NOW"
license-file = "../LICENSE"
repository = "https://github.com/ApexDevelopment/esp-ygg"

[dependencies]
espnow-reliable = { path = "../../espnow-reliable", version = "0.1.0" }
petrified = { path = "../../petrified", version = "0.1.0", default-features = false }
log = "0.4.35"
yggdrasil-proto = { path = "../../yggdrasil-rs/proto", version = "0.1.0" }

[dev-dependencies]
petrified = { path = "../../petrified", version = "0.1.0" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
yggdrasil-mesh = { path = "../../yggdrasil-rs", default-features = false }

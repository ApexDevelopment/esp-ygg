[package]
name = "yggdrasil-espnow"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A sans-IO Yggdrasil node that peers over ESP-NOW"
license-file = "../LICENSE"
repository = "https://github.com/ApexDevelopment/esp-ygg"

[dependencies]
espnow-reliable = "0.1.0"
petrified = { version = "0.1.1", default-features = false }
log = "0.4.35"
yggdrasil-proto = "0.1.0"

[features]
# A simulated radio for tests and desktop previews
sim = []

[dev-dependencies]
# Turns on the simulated radio for this crate's own tests
yggdrasil-espnow = { path = ".", features = ["sim"] }
petrified = "0.1.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
yggdrasil-mesh = { version = "0.1.0", default-features = false }


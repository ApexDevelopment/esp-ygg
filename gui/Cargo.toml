[package]
name = "esp-ygg-gui"
version = "0.1.0"
edition = "2024"
description = "A graphical interface for esp-ygg boards with larger screens, made with Slint"
license-file = "../LICENSE"
publish = false

[dependencies]
esp-ygg-app = { path = "../app", default-features = false, features = ["ui"] }
yggdrasil-espnow = { path = "../node" }
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }

[features]
default = ["console", "irc", "gopher", "gemini", "sftp"]
# The apps beyond Ping, each with the app crate's feature of the same name
console = ["esp-ygg-app/console"]
irc = ["esp-ygg-app/irc"]
gopher = ["esp-ygg-app/gopher", "dep:ttf-parser"]
gemini = ["esp-ygg-app/gemini", "dep:ttf-parser"]
sftp = ["esp-ygg-app/sftp"]

[build-dependencies]
slint-build = "1.18.1"
# Reads the font's glyph widths, so Gopher and Gemini can wrap text themselves
ttf-parser = { version = "0.25.1", optional = true }

[dev-dependencies]
# Saves what the screen shows, in the screenshot example
png = "0.18.1"
# A Gemini server for the screenshot example to browse
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.1.0-pre.0", features = ["std", "tls12"] }

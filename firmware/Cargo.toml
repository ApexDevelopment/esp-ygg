[package]
name = "esp-ygg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Yggdrasil over ESP-NOW firmware for ESP32 chips"
license-file = "../LICENSE"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-net-driver = "0.2.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "proto-ipv4", "proto-ipv6", "tcp", "udp"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }
esp-println = { version = "0.18.0", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp-now", "log-04", "unstable", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-storage = "0.10.0"
embedded-hal-bus = { version = "0.3.0", optional = true }
getrandom = { version = "0.4.3", optional = true }
esp-ygg-app = { path = "../app", default-features = false }
mipidsi = { version = "0.10.0", optional = true }
mousefood = { version = "0.5.3", default-features = false, features = ["fonts"], optional = true }
ratatui = { version = "0.30.2", default-features = false, optional = true }
log = "0.4.35"
petrified = { version = "0.1.1", default-features = false, features = ["fast"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
static_cell = "2.1.1"
yggdrasil-espnow = { path = "../node" }
embedded-sdmmc = { version = "0.10.0", default-features = false, features = ["log"], optional = true }

[features]
default = ["esp32s3", "standard"]
# The small services every board runs unless built without them. Gopher,
# IRC and Gemini are larger; add them with, for example,
# --features cardputer,gopher,irc,gemini
standard = ["http", "console", "ntp"]
http = ["esp-ygg-app/http"]
gopher = ["esp-ygg-app/gopher"]
console = ["esp-ygg-app/console"]
ntp = ["esp-ygg-app/ntp"]
irc = ["esp-ygg-app/irc"]
gemini = ["esp-ygg-app/gemini", "dep:getrandom"]
# Voice calls with push-to-talk, on the Cardputers
voice = ["cardputer", "esp-ygg-app/voice"]
# The on-device UI, which each board with a screen turns on
ui = [
	"esp-ygg-app/ui",
	"dep:embedded-hal-bus",
	"dep:mipidsi",
	"dep:mousefood",
	"dep:ratatui",
]
# M5Stack Cardputer and Cardputer ADV: screen, keyboard and SD card
cardputer = ["esp32s3", "ui", "dep:embedded-sdmmc"]
# Waveshare ESP32-C6-Touch-LCD-2.8: touch screen
c6-touch-lcd = ["esp32c6", "ui"]
esp32s3 = [
	"esp-alloc/esp32s3",
	"esp-backtrace/esp32s3",
	"esp-bootloader-esp-idf/esp32s3",
	"esp-hal/esp32s3",
	"esp-println/esp32s3",
	"esp-radio/esp32s3",
	"esp-rtos/esp32s3",
	"esp-storage/esp32s3",
]
esp32c3 = [
	"esp-alloc/esp32c3",
	"esp-backtrace/esp32c3",
	"esp-bootloader-esp-idf/esp32c3",
	"esp-hal/esp32c3",
	"esp-println/esp32c3",
	"esp-radio/esp32c3",
	"esp-rtos/esp32c3",
	"esp-storage/esp32c3",
]
esp32c6 = [
	"esp-alloc/esp32c6",
	"esp-backtrace/esp32c6",
	"esp-bootloader-esp-idf/esp32c6",
	"esp-hal/esp32c6",
	"esp-println/esp32c6",
	"esp-radio/esp32c6",
	"esp-rtos/esp32c6",
	"esp-storage/esp32c6",
]
esp32 = [
	"esp-alloc/esp32",
	"esp-backtrace/esp32",
	"esp-bootloader-esp-idf/esp32",
	"esp-hal/esp32",
	"esp-println/esp32",
	"esp-radio/esp32",
	"esp-rtos/esp32",
	"esp-storage/esp32",
]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# rustls with a workaround for an Xtensa compiler bug (esp-rs/rust#282),
# which it otherwise trips when optimized.
[patch.crates-io]
rustls = { git = "https://github.com/ApexDevelopment/rustls", branch = "xtensa-0.23.46" }

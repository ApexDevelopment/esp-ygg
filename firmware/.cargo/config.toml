[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3"

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6"

[target.'cfg(target_arch = "xtensa")']
# TLS for Gemini takes its randomness from the hardware, through getrandom.
rustflags = ["-C", "link-arg=-nostartfiles", "--cfg", 'getrandom_backend="custom"']

[target.'cfg(target_arch = "riscv32")']
rustflags = ["-C", "force-frame-pointers", "--cfg", 'getrandom_backend="custom"']

[alias]
s3 = "run --release"
cardputer = "run --release --features cardputer"
cardputer-gemini = "run --profile gemini --features cardputer,gemini"
c3 = "run --release --no-default-features --features esp32c3,standard --target riscv32imc-unknown-none-elf"
c6 = "run --release --no-default-features --features esp32c6,standard --target riscv32imac-unknown-none-elf"
esp32 = "run --release --no-default-features --features esp32,standard --target xtensa-esp32-none-elf"

[env]
ESP_LOG = "info"

[unstable]
build-std = ["alloc", "core"]

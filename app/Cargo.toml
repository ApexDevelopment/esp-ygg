[package]
name = "esp-ygg-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Services and user interface for esp-ygg boards"
license-file = "../LICENSE"
publish = false

[dependencies]
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
log = "0.4.35"
ratatui = { version = "0.30.2", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["tls12"], optional = true }
rustls-rustcrypto = { version = "0.1.0-pre.0", default-features = false, features = ["alloc", "tls12"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false, optional = true }
smoltcp = { version = "0.13.1", default-features = false, features = ["alloc", "medium-ip", "auto-icmp-echo-reply", "proto-ipv6", "socket-icmp", "socket-tcp", "socket-udp"] }
# SSH and SFTP for Share, without the post-quantum key exchange, which is
# large, and which OpenSSH falls back from
sunset = { version = "0.6.0", default-features = false, optional = true }
sunset-async = { version = "0.6.0", default-features = false, optional = true }
sunset-sftp = { version = "0.2.0", optional = true }
yggdrasil-espnow = { path = "../node" }

[features]
default = ["ui", "http", "console", "ntp"]
# The on-device interface. Boards without a screen can leave it out.
ui = ["dep:ratatui"]
# Services, each of which costs memory while the board runs. Gopher, IRC
# and Gemini are larger, so they are off by default.
http = []
gopher = []
console = []
ntp = []
irc = []
gemini = ["dep:rustls", "dep:rustls-rustcrypto", "dep:sha2"]
# Voice calls, on boards with a speaker and microphone
voice = []
# Sending and receiving files over SFTP, with any SFTP software
share = [
	"dep:embassy-futures",
	"dep:embassy-sync",
	"dep:embedded-io-async",
	"dep:sunset",
	"dep:sunset-async",
	"dep:sunset-sftp",
]

[dev-dependencies]
# Turns on every service for this crate's own tests
esp-ygg-app = { path = ".", features = ["gopher", "irc", "gemini", "voice", "share"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Draws the touch board's screen to pictures, in the preview
mousefood = { version = "0.5.3", default-features = false, features = ["fonts"] }
png = "0.18.1"
# A server for the TLS client to talk to
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.1.0-pre.0", features = ["std", "tls12"] }
smoltcp = { version = "0.13.1", default-features = false, features = ["alloc", "medium-ip", "proto-ipv6", "socket-tcp"] }
# Runs Share against OpenSSH's sftp in tests
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "time"] }
# Lets the phone example keep to one network interface
socket2 = { version = "0.6.5", features = ["all"] }
yggdrasil-espnow = { path = "../node", features = ["sim"] }

[[example]]
name = "preview"
required-features = ["ui"]

[[example]]
name = "phone"
required-features = ["voice"]
